<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>接口工具</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ctext y='13' font-size='14' fill='%234ec9b0'%3E%E2%97%87%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <!-- 顶栏 -->
    <header class="topbar">
      <div class="brand">
        <span class="logo">◇</span>
        <span class="brand-name">接口工具</span>
        <span class="brand-sub" id="dataDir" title="">数据目录</span>
      </div>
      <div class="topbar-actions">
        <button class="btn btn-primary" id="btnNew">＋ 新建接口</button>
        <button class="btn" id="btnExport">导出备份</button>
        <button class="btn" id="btnImport">导入备份</button>
        <input type="file" id="fileInput" accept=".json" hidden />
      </div>
    </header>

    <div class="body">
      <!-- 侧栏 -->
      <aside class="sidebar">
        <div class="search-wrap">
          <input type="search" id="search" placeholder="搜索接口名称 / 地址…" autocomplete="off" />
        </div>
        <div class="tree" id="tree"></div>
        <div class="sidebar-foot" id="sidebarFoot"></div>
      </aside>

      <!-- 主区 -->
      <main class="main" id="main">
        <!-- 空态 -->
        <div class="empty" id="empty">
          <div class="empty-inner">
            <div class="empty-icon">◇</div>
            <h2>还没有接口</h2>
            <p>点击左上角「＋ 新建接口」开始录入接口，<br />也可以从已有的备份 JSON 导入。</p>
          </div>
        </div>

        <!-- 接口编辑区 -->
        <section class="editor" id="editor" hidden>
          <div class="snap-banner" id="snapBanner" hidden>
            <span class="tag tag-snap">副本</span>
            <span class="snap-banner-name" id="snapBannerName"></span>
            <span class="snap-time" id="snapBannerTime"></span>
            <span class="spacer"></span>
            <button class="btn" id="btnBackToInterface">返回接口</button>
          </div>
          <div class="req-line">
            <select id="method" class="method-select" title="请求方法"></select>
            <input type="text" id="url" class="url-input" placeholder="https://example.com/api/user/{id}" spellcheck="false" />
            <button class="btn btn-send" id="btnSend">发送</button>
          </div>

          <div class="meta-line">
            <label class="meta-field">
              <span>接口名称</span>
              <input type="text" id="ifaceName" placeholder="例如：查询用户详情" />
            </label>
            <label class="meta-field">
              <span>分组</span>
              <input type="text" id="ifaceGroup" placeholder="例如：用户服务" list="groupList" />
              <datalist id="groupList"></datalist>
            </label>
            <label class="meta-field" id="noteField" hidden>
              <span>备注</span>
              <input type="text" id="snapNote" placeholder="副本备注（可选）" />
            </label>
            <div class="meta-actions">
              <button class="btn btn-primary" id="btnSave">保存</button>
              <button class="btn" id="btnDuplicate">复制接口</button>
              <button class="btn" id="btnSaveSnapshot">保存副本</button>
              <button class="btn btn-danger" id="btnDelete">删除</button>
            </div>
          </div>

          <div class="subtabs" id="subtabs">
            <button class="subtab active" data-tab="params">参数 <span class="badge" id="badgeParams"></span></button>
            <button class="subtab" data-tab="headers">请求头 <span class="badge" id="badgeHeaders"></span></button>
            <button class="subtab" data-tab="body">请求体 <span class="badge" id="badgeBody"></span></button>
            <button class="subtab" data-tab="doc">文档</button>
            <button class="subtab" data-tab="options">设置</button>
          </div>

          <div class="pane-area">
            <div class="pane" data-pane="params">
              <div class="pane-block">
                <div class="pane-title">路径参数 <span class="hint">在地址中写 <code>{id}</code>，这里会自动列出</span></div>
                <div id="pathTable"></div>
              </div>
              <div class="pane-block">
                <div class="pane-title">URL 参数 (Query)</div>
                <div id="queryTable"></div>
              </div>
            </div>

            <div class="pane" data-pane="headers" hidden>
              <div class="pane-block">
                <div class="pane-title">请求头
                  <span class="quick">
                    <button class="link-btn" data-qt="Content-Type" data-qv="application/json">Content-Type</button>
                    <button class="link-btn" data-qt="Authorization" data-qv="Bearer ">Authorization</button>
                    <button class="link-btn" data-qt="Cookie" data-qv="">Cookie</button>
                  </span>
                </div>
                <div id="headerTable"></div>
              </div>
            </div>

            <div class="pane" data-pane="body" hidden>
              <div class="pane-block">
                <div class="pane-title">请求体类型
                  <select id="bodyMode" class="inline-select">
                    <option value="none">无</option>
                    <option value="json">JSON</option>
                    <option value="raw">原始文本</option>
                    <option value="urlencoded">x-www-form-urlencoded</option>
                    <option value="form">form-data</option>
                  </select>
                  <span id="rawCtWrap" class="hint" hidden>
                    Content-Type：<input type="text" id="rawContentType" class="inline-input" placeholder="text/plain" />
                  </span>
                  <button class="link-btn" id="btnFormatJson" hidden>格式化 JSON</button>
                </div>
                <div id="bodyTextWrap">
                  <textarea id="bodyText" class="code-input" spellcheck="false" placeholder='{ "name": "value" }'></textarea>
                </div>
                <div id="bodyFormWrap" hidden></div>
              </div>
            </div>

            <div class="pane" data-pane="doc" hidden>
              <div class="pane-block doc-pane">
                <div class="pane-title">接口文档（Markdown）
                  <span class="quick">
                    <button class="link-btn" data-doc="h2">标题</button>
                    <button class="link-btn" data-doc="table">表格</button>
                    <button class="link-btn" data-doc="code">代码块</button>
                  </span>
                </div>
                <div class="doc-split">
                  <textarea id="docText" class="code-input" spellcheck="false" placeholder="# 接口说明&#10;&#10;支持 Markdown 语法：标题、列表、表格、代码块、链接…"></textarea>
                  <div class="doc-preview markdown" id="docPreview"></div>
                </div>
              </div>
            </div>

            <div class="pane" data-pane="options" hidden>
              <div class="pane-block">
                <div class="pane-title">请求设置</div>
                <div class="options">
                  <label class="opt"><span>超时时间</span><input type="number" id="optTimeout" min="1" max="600" /> 秒</label>
                  <label class="opt"><input type="checkbox" id="optTLSSkip" /> 跳过 HTTPS 证书校验（自签证书时使用）</label>
                  <label class="opt"><input type="checkbox" id="optRedirect" /> 自动跟随 3xx 重定向</label>
                </div>
              </div>
            </div>
          </div>

          <!-- 响应区 -->
          <div class="response" id="response">
            <div class="resp-bar">
              <span class="resp-title">响应</span>
              <span class="resp-stat" id="respStat">尚未发送请求</span>
              <span class="spacer"></span>
              <div class="resp-tabs">
                <button class="subtab active" data-rtab="body">响应体</button>
                <button class="subtab" data-rtab="headers">响应头</button>
              </div>
              <button class="link-btn" id="btnPretty">格式化</button>
              <button class="link-btn" id="btnCopyResp">复制</button>
            </div>
            <div class="resp-body">
              <pre class="code-view" id="respBody"></pre>
              <div class="kv-view" id="respHeaders" hidden></div>
            </div>
          </div>
        </section>

      </main>
    </div>
  </div>

  <!-- 弹窗 -->
  <div class="modal-mask" id="modalMask" hidden>
    <div class="modal">
      <h3 id="modalTitle">提示</h3>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-foot">
        <button class="btn" id="modalCancel">取消</button>
        <button class="btn btn-primary" id="modalOk">确定</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script type="module" src="app.js"></script>
</body>
</html>
